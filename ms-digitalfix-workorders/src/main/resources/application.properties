server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/workorders_db}
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ============================================================
#  RABBITMQ
#  En local: localhost. En Docker/EC2: IP del broker.
#  Usar SPRING_RABBITMQ_HOST para sobreescribir via env-var.
# ============================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=root
spring.rabbitmq.password=pass123

# ACK/NACK explicito: el consumidor controla cuando confirma el mensaje
spring.rabbitmq.listener.simple.acknowledge-mode=manual

# ============================================================
#  NOMBRES DE INFRAESTRUCTURA RABBITMQ
#  Centralizados aqui para no repetir strings en el codigo.
# ============================================================
app.rabbitmq.exchange.direct=cmd.direct
app.rabbitmq.exchange.topic=cmd.topic
app.rabbitmq.exchange.dlx=cmd.dead.dlx
