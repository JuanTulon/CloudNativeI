spring.application.name=ms-digitalfix-rabbitmq-admin

# Puerto interno. El BFF se comunica con este servicio por la red interna de Docker.
server.port=8086

# ============================================================
#  RABBITMQ
#  En local: localhost. En Docker/EC2: IP del broker o nombre del servicio.
#  Usar variables de entorno para sobreescribir en produccion.
# ============================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=root
spring.rabbitmq.password=pass123

# ============================================================
#  ACTUATOR
#  Endpoint de health para Docker health checks
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
#  LOGGING
# ============================================================
logging.level.com.digitalfix.rabbitmq_admin=INFO
logging.level.org.springframework.amqp=WARN
