spring.application.name=ms-digitalfix-notify

# Puerto interno. En Docker Compose no se publica al host:
# solo se alcanza desde la red interna de contenedores.
server.port=8084

#  RABBITMQ
#  En local: localhost. En Docker/EC2: IP del broker (o nombre del servicio en compose).
#  Usar variables de entorno para sobreescribir en produccion.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=root
spring.rabbitmq.password=pass123

# ACK/NACK explicito: el consumidor decide cuando confirmar cada mensaje
spring.rabbitmq.listener.simple.acknowledge-mode=manual

app.rabbitmq.queue.email=q.cmd.email
app.rabbitmq.queue.dispatch=q.cmd.dispatch
app.rabbitmq.queue.report=q.cmd.report
app.rabbitmq.queue.email.dlq=q.cmd.email.dlq
app.rabbitmq.queue.dispatch.dlq=q.cmd.dispatch.dlq
app.rabbitmq.queue.report.dlq=q.cmd.report.dlq

# Logging
logging.level.com.digitalfix.notify=INFO
